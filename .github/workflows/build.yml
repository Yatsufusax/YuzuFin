name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "true" si cargaste los secretos de firma en el repo (ver README).
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # El cambio de nombre a Monea renombró estos archivos. Si al copiar el zip quedaron los viejos
      # al lado de los nuevos, rompen la compilación (recursos duplicados / clases viejas).
      # Se puede quitar este paso cuando ya no existan en el repo.
      - name: Quitar archivos viejos del cambio de nombre
        run: |
          rm -f app/src/main/res/drawable-nodpi/mascot_terere_paraguay.png
          rm -f app/src/main/res/drawable-nodpi/mascot_mate_argentina.png
          rm -f app/src/main/res/drawable-nodpi/mascot_cafe.png
          rm -f app/src/main/java/com/yuzufin/app/ui/YuzuFinApp.kt
          rm -f app/src/main/java/com/yuzufin/app/ui/navigation/YuzuNavHost.kt
          rm -f app/src/main/res/drawable/ic_stat_yuzu.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      - name: Preparar la firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monea.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/monea.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Monea-0.2.${{ github.run_number }}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Monea-apk
          path: Monea-0.2.${{ github.run_number }}.apk
          if-no-files-found: error

      # Solo con la clave fija: publica una Release que la app detecta como actualización.
      - name: Publicar Release
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Monea 0.2.${{ github.run_number }}
          # Lo que dice NOVEDADES.md es lo que la app muestra en la ventana de actualización.
          body_path: NOVEDADES.md
          files: Monea-0.2.${{ github.run_number }}.apk
          make_latest: true
